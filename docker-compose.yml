# Accounting Cloud: web app + MongoDB (+ optional MCP server).
#
#   cp .env.example .env      # then set SECRET_KEY (and MCP_API_TOKEN if using MCP)
#   docker compose up -d --build
#   open http://localhost:5052
#
# --build builds the image from this checkout. Without it, Compose uses the
# published image (ghcr.io/avansledright/accounting-cloud), pinned with
# ACCOUNTING_CLOUD_VERSION. The one-command installer (install.sh /
# install.ps1) uses a copy of this file with the build lines removed.
#
# Optional MCP server for AI clients:
#   docker compose --profile mcp up -d --build
#
# SECURITY: the web app has NO login. The port below is bound to 127.0.0.1 so
# it is only reachable from this machine. To expose it, put it behind a
# reverse proxy with authentication (see docs/deployment.md). Do not just
# change the bind address to 0.0.0.0.

services:
  web:
    build: .
    image: ghcr.io/avansledright/accounting-cloud:${ACCOUNTING_CLOUD_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5052}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://db:27017/
      MONGO_DB_NAME: ${MONGO_DB_NAME:-accounting_cloud}
      CC_STATEMENT_DIR: /app/data/cc_statements
    volumes:
      - cc_statements:/app/data/cc_statements
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    profiles: ["mcp"]
    image: ghcr.io/avansledright/accounting-cloud:${ACCOUNTING_CLOUD_VERSION:-latest}
    build: .
    command: ["python", "mcp_server.py"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://db:27017/
      MONGO_DB_NAME: ${MONGO_DB_NAME:-accounting_cloud}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
  cc_statements:
