name: Release

# On a version tag (v1.2.3): build the image for amd64 and arm64, push it to
# GHCR, and attach the installer files to the GitHub release:
#   install.sh, install.ps1  - one-command installers
#   docker-compose.yml       - the repo's file with build lines removed and the
#                              image pinned to this version
# The installers download releases/latest/download/<file>, so a release is
# live for new installs as soon as these assets are uploaded.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/accounting-cloud

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  assets:
    needs: image
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release files
        run: |
          mkdir dist
          scripts/release/release-compose.sh "$TAG" > dist/docker-compose.yml
          cp install.sh install.ps1 dist/
      - name: Create the release if needed and upload the files
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Notes: this version's CHANGELOG section.
            awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[Unreleased\]:/ {f=0} f' CHANGELOG.md > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
