name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Compile all modules
        run: python -m compileall -q app.py ai.py models.py demo_data.py benefits.py home_move.py recurrence.py mcp_server.py payroll_forms.py payroll_validator.py agent scripts
      - name: Unit tests
        run: pytest -q tests

  installers:
    # Runs install.sh and install.ps1 against a locally built image, the way
    # the release workflow packages them, then uninstalls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/release/release-compose.sh
      - name: Build the image and the release files
        run: |
          docker build -q -t ghcr.io/avansledright/accounting-cloud:ci .
          mkdir rel
          scripts/release/release-compose.sh ci > rel/docker-compose.yml
          cp install.sh install.ps1 rel/
      - name: install.sh
        env:
          ACCOUNTING_CLOUD_DIR: ${{ runner.temp }}/ac-sh
          ACCOUNTING_CLOUD_BASE_URL: file://${{ github.workspace }}/rel
          ACCOUNTING_CLOUD_SKIP_PULL: "1"
          NO_BROWSER: "1"
        run: |
          sh rel/install.sh
          curl -fsS http://127.0.0.1:5052/health
          sh rel/install.sh | grep -q "Keeping existing"     # re-run keeps settings
          "$ACCOUNTING_CLOUD_DIR/accounting-cloud" backup
          "$ACCOUNTING_CLOUD_DIR/accounting-cloud" uninstall --delete-data
      - name: install.ps1 (PowerShell 7 on Linux; shortcuts are Windows-only)
        env:
          ACCOUNTING_CLOUD_DIR: ${{ runner.temp }}/ac-ps
          ACCOUNTING_CLOUD_BASE_URL: ${{ github.workspace }}/rel
          ACCOUNTING_CLOUD_SKIP_PULL: "1"
          NO_BROWSER: "1"
          WEB_PORT: "5053"
        run: |
          pwsh -NoProfile -Command 'Get-Content -Raw rel/install.ps1 | Invoke-Expression'
          curl -fsS http://127.0.0.1:5053/health
          pwsh -NoProfile -File "$ACCOUNTING_CLOUD_DIR/accounting-cloud-cli.ps1" uninstall --delete-data

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=ci-$(openssl rand -hex 16)/" .env
          sed -i "s/^MCP_API_TOKEN=.*/MCP_API_TOKEN=ci-token/" .env
          docker compose --profile mcp up -d --build --wait --wait-timeout 180
      - name: Health check and page smoke test (empty database)
        run: |
          curl -fsS http://127.0.0.1:5052/health
          # A fresh install sends the dashboard to the setup wizard.
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:5052/)
          echo "/ -> $loc"; case "$loc" in */setup/welcome) ;; *) exit 1 ;; esac
          for p in /setup/welcome /ledger /budget /accounts /credit-cards /portfolio /networth /debts /goals /benefits /tools/home-move /analytics /calendar /reports /admin /payroll /transfers; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5052$p")
            echo "$code $p"; [ "$code" = 200 ]
          done
      - name: Seed demo data and re-check pages
        run: |
          docker compose exec -T web python scripts/seed_demo.py
          for p in / /ledger /budget /accounts /credit-cards /portfolio /networth /debts /goals /benefits /analytics; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5052$p")
            echo "$code $p"; [ "$code" = 200 ]
          done
      - name: MCP server requires the token
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/http)" = 401
          curl -fsS -X POST http://127.0.0.1:8765/http \
            -H "Authorization: Bearer ci-token" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"account_balances","arguments":{}}}' | grep -q "Demo Checking"
      - name: Logs on failure
        if: failure()
        run: docker compose --profile mcp logs
