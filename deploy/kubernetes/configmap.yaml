# Non-secret settings. See .env.example in the repo root for every variable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounting-config
  namespace: accounting
data:
  MONGO_URI: "mongodb://mongodb:27017/"
  MONGO_DB_NAME: "accounting_cloud"
  # Set to the sub-path if the Ingress serves the app under one (e.g. /accounting),
  # and change the probe paths in deployment.yaml to match.
  APPLICATION_ROOT: "/"
  CC_STATEMENT_DIR: "/app/data/cc_statements"
  # Time zone for the 17:00 price refresh, the report scheduler and "today".
  # The image defaults to UTC; uncomment and set yours (applies to web and MCP).
  # TZ: "America/New_York"
  # Optional AI (Ollama-compatible endpoints). Off while the hosts are empty;
  # e.g. "http://ollama.ollama.svc.cluster.local:11434" for an in-cluster Ollama.
  OLLAMA_URL: ""
  OLLAMA_MODEL: "granite4.2:3b"
  CC_LLM_ENABLED: "true"
  ADVISOR_ENABLED: "false"
  AGENT_OLLAMA_HOST: ""
  AGENT_OLLAMA_MODEL: "gemma4:e4b"
