{% extends "base.html" %}

{% block content %}
    <h1>Edit Account</h1>

    <div class="data-entry">
        <form method="POST" action="{{ url_for('edit_account', account_id=account._id) }}" class="account-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Account Name:</label>
                    <input type="text" id="name" name="name" value="{{ account.name }}" required>
                </div>
                <div class="form-group">
                    <label for="account_type">Account Type:</label>
                    <select id="account_type" name="account_type" required>
                        {% for value, label in account_types %}
                        <option value="{{ value }}" {{ 'selected' if account.account_type == value else '' }}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="institution">Institution:</label>
                    <input type="text" id="institution" name="institution" value="{{ account.institution }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="balance">Starting Balance:</label>
                    <input type="number" id="balance" name="balance" value="{{ account.balance }}" step="0.01">
                </div>
                <div class="form-group">
                    <label for="account_number">Account # (last 4):</label>
                    <input type="text" id="account_number" name="account_number" value="{{ account.account_number or '' }}" maxlength="4">
                </div>
                <div class="form-group">
                    <label for="notes">Notes:</label>
                    <input type="text" id="notes" name="notes" value="{{ account.notes or '' }}">
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="is_primary" name="is_primary" {{ 'checked' if account.is_primary else '' }}>
                        Primary Account (for ledger)
                    </label>
                </div>
            </div>
            <div class="form-row investment-fields" id="investment-fields" style="display: none;">
                <div class="form-group">
                    <label for="management_type">Management:</label>
                    <select id="management_type" name="management_type">
                        <option value="">N/A</option>
                        <option value="managed" {{ 'selected' if account.get('management_type') == 'managed' else '' }}>Managed</option>
                        <option value="self_managed" {{ 'selected' if account.get('management_type') == 'self_managed' else '' }}>Self-Managed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="estimated_return_rate">Est. Annual Return (%):</label>
                    <input type="number" id="estimated_return_rate" name="estimated_return_rate" placeholder="e.g., 7.0" step="0.1" value="{{ account.get('estimated_return_rate', '') or '' }}">
                </div>
                <div class="form-group">
                    <label for="balance_as_of_date">Balance As-Of Date:</label>
                    <input type="date" id="balance_as_of_date" name="balance_as_of_date" value="{{ account.get('balance_as_of_date', '').strftime('%Y-%m-%d') if account.get('balance_as_of_date') and account.balance_as_of_date is not string else (account.get('balance_as_of_date', '')[:10] if account.get('balance_as_of_date') else '') }}">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="{{ url_for('accounts_page') }}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        const accountTypeSelect = document.getElementById('account_type');
        const investmentFields = document.getElementById('investment-fields');
        const investmentTypes = {{ investment_account_types | tojson }};

        function toggleInvestmentFields() {
            if (investmentFields) {
                investmentFields.style.display = investmentTypes.includes(accountTypeSelect.value) ? 'flex' : 'none';
            }
        }

        if (accountTypeSelect) {
            accountTypeSelect.addEventListener('change', toggleInvestmentFields);
            toggleInvestmentFields();
        }
    </script>
{% endblock %}
