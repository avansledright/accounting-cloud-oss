{% extends "base.html" %}

{% block content %}
    <h1>Edit Debt</h1>

    <div class="data-entry">
        <form method="POST" action="{{ url_for('edit_debt', debt_id=debt._id) }}" class="budget-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Debt Name:</label>
                    <input type="text" id="name" name="name" value="{{ debt.name }}" required>
                </div>
                <div class="form-group">
                    <label for="debt_type">Type:</label>
                    <select id="debt_type" name="debt_type" required>
                        {% for value, label in debt_types %}
                        <option value="{{ value }}" {{ 'selected' if debt.debt_type == value else '' }}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="balance">Starting Balance:</label>
                    <input type="number" id="balance" name="balance" value="{{ debt.balance }}" step="0.01" required>
                    <small style="color:#6c757d;">Linked payments are subtracted from this to show the current balance.</small>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="interest_rate">Interest Rate (APR %):</label>
                    <input type="number" id="interest_rate" name="interest_rate" value="{{ debt.interest_rate or '' }}" step="0.01">
                </div>
                <div class="form-group">
                    <label for="minimum_payment">Minimum Payment:</label>
                    <input type="number" id="minimum_payment" name="minimum_payment" value="{{ debt.minimum_payment or '' }}" step="0.01">
                </div>
                <div class="form-group">
                    <label for="creditor">Creditor:</label>
                    <input type="text" id="creditor" name="creditor" value="{{ debt.creditor or '' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="account_number">Account Number:</label>
                    <input type="text" id="account_number" name="account_number" value="{{ debt.account_number or '' }}">
                </div>
                <div class="form-group">
                    <label for="payment_match">Auto-link descriptions:</label>
                    <input type="text" id="payment_match" name="payment_match" value="{{ (debt.payment_match or [])|join(', ') }}" placeholder="e.g., Car Payment">
                    <small style="color:#6c757d;">Comma-separated ledger descriptions that auto-link as payments.</small>
                </div>
                <div class="form-group full-width">
                    <label for="notes">Notes:</label>
                    <textarea id="notes" name="notes">{{ debt.notes or '' }}</textarea>
                </div>
            </div>
            <div class="form-row" id="deferment-row" style="{{ 'display:flex' if debt.debt_type == 'student_loan' else 'display:none' }}">
                <div class="form-group">
                    <label for="deferment_end_date">Deferment End Date:</label>
                    <input type="date" id="deferment_end_date" name="deferment_end_date" value="{{ debt.deferment_end_date or '' }}">
                </div>
                <div class="form-group">
                    <label for="subsidized" style="display: block; margin-bottom: 0.5rem;">Subsidized:</label>
                    <label style="font-weight: normal; display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="subsidized" name="subsidized" value="1" {{ 'checked' if debt.subsidized else '' }}>
                        No interest accrues during deferment
                    </label>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="{{ url_for('debts_page') }}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        const debtTypeSelect = document.getElementById('debt_type');
        const defermentRow = document.getElementById('deferment-row');
        if (debtTypeSelect && defermentRow) {
            debtTypeSelect.addEventListener('change', function() {
                defermentRow.style.display = this.value === 'student_loan' ? 'flex' : 'none';
            });
        }
    </script>
{% endblock %}
